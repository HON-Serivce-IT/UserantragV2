<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Benutzerverwaltung · DHI-Gruppe</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Dorint CD 2023 – Design-System
   Layout: App-Shell – Kopfzeile Nachtblau mit 3px-Akzentlinie Graubeige, linke Navigation pro Standort,
   Arbeitsfläche mit Formular + technischer Vorschau. Abstände strikt im 8px-Grid. */
:root{
  /* Farben (CD 2023) */
  --cd-primaer:#0e214a;      /* Pantone 2768 Nachtblau  – Primär */
  --cd-sekundaer:#c6baae;    /* Pantone 7528 Graubeige  – Sekundär */
  --cd-hell:#f5f3ef;         /* Hellbeige (abgeleitet)  – Hintergründe */
  --cd-text:#3a3530;         /* Dunkelwarm              – Fließtext */
  --cd-neben:#8a8278;        /* Mittelwarm              – Nebentext */
  --cd-weiss:#ffffff;
  /* abgeleitete Hilfstöne – nur aus CD-Farben gemischt */
  --cd-linie:#e3ddd5;        /* Graubeige 50 % auf Hellbeige */
  --cd-flaeche:#ece7e0;      /* Graubeige 25 % auf Hellbeige */
  --cd-primaer-hover:#1a2f5e;
  /* Statusfarben – warm abgestimmt, kein Reinrot/-grün */
  --ok:#3d6b4f; --ok-bg:#e6ede6; --err:#9b3b2e; --err-bg:#f4e4df; --warn:#8a6420; --warn-bg:#f3ead9;
  /* Abstände – 8px-Grid */
  --s1:8px; --s2:16px; --s3:24px; --s4:32px;
  --akzent:3px; --schutzzone:28px;
  /* Typografie */
  --font:"CorpoS","Trebuchet MS",Arial,sans-serif;
  --font-code:Consolas,"Courier New",monospace;
  --r:2px;
  color-scheme:light;
}
*{box-sizing:border-box;font-style:normal!important}
body{background:var(--cd-hell);color:var(--cd-text);font-family:var(--font);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--cd-primaer)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cd-sekundaer);outline-offset:2px}
a{color:var(--cd-primaer);text-decoration-color:var(--cd-sekundaer);text-decoration-thickness:2px;text-underline-offset:3px}
code{font-family:var(--font-code);font-size:13px}

/* Kopfzeile */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cd-primaer);color:var(--cd-weiss);
  border-bottom:var(--akzent) solid var(--cd-sekundaer);
  padding-block:var(--s2);padding-left:max(var(--schutzzone),env(safe-area-inset-left,0px));padding-right:max(var(--s3),env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:var(--s2);margin-right:auto}
.brand b{font-weight:700;font-size:19px;letter-spacing:.02em}
.brand span{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--cd-sekundaer)}
.demo-pill{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--cd-sekundaer);color:var(--cd-sekundaer);padding:2px var(--s1)}
.who{display:flex;align-items:center;gap:var(--s1);font-size:13px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--cd-sekundaer);color:var(--cd-primaer);display:grid;place-items:center;font-weight:700;font-size:12px}

/* Shell */
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:calc(100vh - 67px)}
nav.side{border-right:1px solid var(--cd-linie);background:var(--cd-weiss);padding:var(--s3) var(--s2);display:flex;flex-direction:column;gap:var(--s1)}
.hotelbox{padding-bottom:var(--s3);border-bottom:1px solid var(--cd-linie);margin-bottom:var(--s1)}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--cd-neben);margin-bottom:var(--s1);font-weight:700}
.navbtn{display:flex;gap:var(--s1);align-items:center;text-align:left;padding:var(--s1) var(--s2) var(--s1) calc(var(--s2) - var(--akzent));border:0;border-left:var(--akzent) solid transparent;background:none;cursor:pointer;color:var(--cd-text);min-height:40px}
.navbtn:hover{background:var(--cd-hell)}
.navbtn[aria-current="page"]{background:var(--cd-hell);border-left-color:var(--cd-primaer);color:var(--cd-primaer);font-weight:700}
.navbtn:disabled{color:var(--cd-neben);opacity:.55;cursor:not-allowed}
.navbtn svg{width:18px;height:18px;flex:none}
.navgroup{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--cd-neben);padding:var(--s2) var(--s2) 0;font-weight:700}

main{padding-block:var(--s4) 64px;padding-left:max(var(--s3),env(safe-area-inset-left,0px));padding-right:max(var(--s3),env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1184px;margin:0 auto}
h1{font-weight:700;font-size:30px;line-height:1.2;margin:0 0 var(--s1);text-wrap:balance;color:var(--cd-primaer);letter-spacing:.005em}
h1::after{content:"";display:block;width:48px;height:var(--akzent);background:var(--cd-sekundaer);margin-top:var(--s2)}
.success h1::after{margin-inline:auto}
.sub{color:var(--cd-neben);margin:0 0 var(--s3)}

/* Panels */
.split{display:grid;grid-template-columns:minmax(0,1fr) 344px;gap:var(--s3);align-items:start}
.panel{background:var(--cd-weiss);border:1px solid var(--cd-linie)}
.sec{padding:var(--s4);border-bottom:1px solid var(--cd-linie)}
.sec:last-child{border-bottom:0}
.sec h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--cd-primaer);margin:0 0 var(--s3);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3) var(--s2)}
.grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.field label{font-size:13px;font-weight:700;color:var(--cd-text)}
.field label .req{color:var(--err)}
.field small{color:var(--cd-neben);font-size:12px}
.field .error{color:var(--err);font-size:12px;font-weight:700}
input[type=text],input[type=email],input[type=date],input[type=search],select,textarea{width:100%;min-height:40px;padding:var(--s1) var(--s2);border:1px solid var(--cd-sekundaer);border-radius:var(--r);background:var(--cd-weiss);color:var(--cd-text)}
input:focus,select:focus,textarea:focus{border-color:var(--cd-primaer);outline:none;box-shadow:0 0 0 1px var(--cd-primaer)}
input[readonly]{background:var(--cd-hell);color:var(--cd-neben);border-color:var(--cd-linie)}
input.bad{border-color:var(--err);background:var(--err-bg)}
textarea{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:var(--s1)}
.chip{border:1px solid var(--cd-sekundaer);background:var(--cd-weiss);padding:4px var(--s2);border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--cd-text);min-height:32px}
.chip:hover{border-color:var(--cd-primaer)}
.chip[aria-pressed="true"]{background:var(--cd-primaer);border-color:var(--cd-primaer);color:var(--cd-weiss)}
.toggles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:var(--s1);padding:var(--s2);border:1px solid var(--cd-linie);background:var(--cd-hell);cursor:pointer;font-weight:700;font-size:14px}
.tog input{appearance:none;width:40px;height:24px;border-radius:99px;background:var(--cd-sekundaer);position:relative;cursor:pointer;flex:none;transition:background .15s}
.tog input::after{content:"";position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:var(--cd-weiss);transition:left .15s}
.tog input:checked{background:var(--cd-primaer)}
.tog input:checked::after{left:20px}
.actions{display:flex;gap:var(--s2);justify-content:flex-end;padding:var(--s3) var(--s4);flex-wrap:wrap;background:var(--cd-hell);border-top:1px solid var(--cd-linie)}
.btn{min-height:40px;padding:var(--s1) var(--s3);border-radius:var(--r);border:1px solid var(--cd-primaer);background:var(--cd-primaer);color:var(--cd-weiss);cursor:pointer;font-weight:700;letter-spacing:.02em}
.btn:hover{background:var(--cd-primaer-hover)}
.btn.ghost{background:var(--cd-weiss);color:var(--cd-primaer);border-color:var(--cd-primaer)}
.btn.ghost:hover{background:var(--cd-hell)}
.btn:disabled{background:var(--cd-sekundaer);border-color:var(--cd-sekundaer);color:var(--cd-weiss);cursor:not-allowed}
.btn.sm{min-height:32px;padding:4px var(--s2);font-size:13px}

/* Technik-Panel */
aside.tech{position:sticky;top:96px}
.tech .sec{padding:var(--s3)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s1) var(--s2);font-size:13px;margin:0}
.kv dt{color:var(--cd-neben)}
.kv dd{margin:0;font-family:var(--font-code);font-size:12px;word-break:break-all;color:var(--cd-text)}
pre.code{margin:0;background:var(--cd-hell);border:1px solid var(--cd-linie);padding:var(--s2);font-family:var(--font-code);font-size:11.5px;line-height:1.6;overflow:auto;max-height:344px;white-space:pre;color:var(--cd-text)}
.endpoint{font-family:var(--font-code);font-size:12px;margin-bottom:var(--s1);color:var(--cd-primaer);word-break:break-all}
.endpoint b{background:var(--cd-primaer);color:var(--cd-weiss);padding:1px var(--s1);margin-right:var(--s1);font-weight:700}

/* Start */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.tile{text-align:left;padding:var(--s3);border:1px solid var(--cd-linie);border-top:var(--akzent) solid var(--cd-sekundaer);background:var(--cd-weiss);cursor:pointer;display:flex;flex-direction:column;gap:var(--s1);min-height:136px;color:var(--cd-text)}
.tile:hover{border-top-color:var(--cd-primaer)}
.tile b{font-size:16px;color:var(--cd-primaer)}
.tile span{color:var(--cd-neben);font-size:13px}
.tile svg{width:24px;height:24px;color:var(--cd-primaer);margin-bottom:var(--s1)}
.welcome{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--s3);margin-bottom:var(--s4)}
.welcome .panel{padding:var(--s4)}
.support{display:grid;gap:var(--s1);font-size:14px;align-content:start}

/* Listen */
.users{display:grid}
.urow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--s2);align-items:center;padding:var(--s2) var(--s4);border:0;border-bottom:1px solid var(--cd-linie);cursor:pointer;background:none;text-align:left;width:100%;color:var(--cd-text)}
.urow:hover{background:var(--cd-hell)}
.urow:last-child{border-bottom:0}
.uav{width:40px;height:40px;border-radius:50%;background:var(--cd-sekundaer);display:grid;place-items:center;font-weight:700;color:var(--cd-primaer);font-size:14px}
.urow .meta{color:var(--cd-neben);font-size:13px}
.empty{padding:var(--s4);text-align:center;color:var(--cd-neben)}
.badge{font-size:11px;padding:2px var(--s1);background:var(--cd-hell);color:var(--cd-neben);font-family:var(--font-code)}
.note{padding:var(--s2);background:var(--warn-bg);color:var(--warn);font-size:13px;border-left:var(--akzent) solid var(--warn)}
.note.info{background:var(--cd-hell);color:var(--cd-text);border-left-color:var(--cd-sekundaer)}
.inline{display:flex;gap:var(--s1);align-items:stretch}
.inline > input{flex:1;min-width:0}
.status{font-size:13px;font-weight:700}
.status.ok{color:var(--ok)} .status.err{color:var(--err)}
.picked{display:flex;flex-wrap:wrap;gap:var(--s1);min-height:48px;padding:var(--s1);border:1px dashed var(--cd-sekundaer);background:var(--cd-hell)}
.picked .chip{cursor:default}
.picked .chip button{border:0;background:none;cursor:pointer;margin-left:var(--s1);color:inherit;font-weight:700}

/* Dialog, Erfolg, Toast */
.modal-bg{position:fixed;inset:0;background:rgba(14,33,74,.6);display:grid;place-items:center;z-index:20;padding:var(--s2)}
.modal{background:var(--cd-weiss);max-width:520px;width:100%;padding:var(--s4);display:grid;gap:var(--s3);border-top:var(--akzent) solid var(--cd-sekundaer)}
.modal h3{font-weight:700;font-size:22px;margin:0;color:var(--cd-primaer)}
.success{max-width:624px;margin:var(--s4) auto;text-align:center;display:grid;gap:var(--s3);justify-items:center}
.check{width:72px;height:72px;border-radius:50%;background:var(--cd-primaer);display:grid;place-items:center;color:var(--cd-weiss);box-shadow:0 0 0 var(--s1) var(--cd-sekundaer)}
.check svg{width:36px;height:36px}
.toast{position:fixed;right:max(var(--s3),env(safe-area-inset-right,0px));bottom:calc(var(--s3) + env(safe-area-inset-bottom,0px));background:var(--cd-primaer);color:var(--cd-weiss);padding:var(--s2) var(--s3);z-index:30;font-size:14px;border-left:var(--akzent) solid var(--cd-sekundaer)}

@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)} aside.tech{position:static}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.welcome{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .top{padding-left:max(var(--s2),env(safe-area-inset-left,0px));padding-right:max(var(--s2),env(safe-area-inset-right,0px))}
  main{padding-left:max(var(--s2),env(safe-area-inset-left,0px));padding-right:max(var(--s2),env(safe-area-inset-right,0px))}
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{border-right:0;border-bottom:1px solid var(--cd-linie);flex-direction:row;overflow-x:auto;padding:var(--s1)}
  .hotelbox,.navgroup{display:none}
  .navbtn{white-space:nowrap;flex:none;border-left:0;border-bottom:var(--akzent) solid transparent;padding:var(--s1) var(--s2)}
  .navbtn[aria-current="page"]{border-bottom-color:var(--cd-primaer)}
  .grid,.toggles,.tiles{grid-template-columns:minmax(0,1fr)}
  .sec{padding:var(--s3) var(--s2)} .actions{padding:var(--s2)} .urow{padding:var(--s2)}
  .who span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Ergänzungen für die Live-Version */
.users.scroll{max-height:420px;overflow-y:auto;border:1px solid var(--cd-linie);margin-top:var(--s2)}
.users.scroll .urow{padding:var(--s1) var(--s2)}
.split.noaside{grid-template-columns:minmax(0,1fr);max-width:880px}
.flabel{font-size:13px;font-weight:700;color:var(--cd-text)}
.chip.mono{font-family:var(--font-code)}
.warnline{color:var(--warn);font-size:12px;font-weight:700}
.loading{padding:var(--s4);text-align:center;color:var(--cd-neben)}
.login{max-width:560px;margin:var(--s4) auto}
.urow.static{cursor:default}
.urow.static:hover{background:none}
.empty.err{color:var(--err)}
details.sec summary{cursor:pointer;font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--cd-primaer);font-weight:700;list-style-position:inside}
details.sec[open] summary{margin-bottom:var(--s2)}
.merr{padding:var(--s2);background:var(--err-bg);color:var(--err);font-size:13px;border-left:var(--akzent) solid var(--err)}
.mbtns{display:grid;gap:var(--s1)}
.modal p{margin:0}
select.time{width:104px;flex:none}
.toast.err{background:var(--err);border-left-color:var(--cd-sekundaer)}
.linkbtn{background:none;border:1px solid var(--cd-sekundaer);color:var(--cd-weiss);padding:4px var(--s2);cursor:pointer;font-size:13px;border-radius:var(--r)}
.linkbtn:hover{background:var(--cd-primaer-hover)}
.top .logo-zone{width:var(--schutzzone)}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>IT Benutzerverwaltung</b><span>DHI-Gruppe</span></div>
  <span class="demo-pill" id="demoPill" hidden>Demo · Beispieldaten</span>
  <div class="who" id="who" hidden><div class="avatar" id="avatar">?</div><span id="whoName"></span><button class="linkbtn" id="logout">Abmelden</button></div>
</header>

<div class="shell">
  <nav class="side" aria-label="Hauptnavigation">
    <div class="hotelbox">
      <label class="lbl" for="hotelSel">Standort</label>
      <select id="hotelSel"><option value="">Hotel auswählen …</option></select>
    </div>
    <button class="navbtn" data-view="start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Start</button>
    <div class="navgroup">Mitarbeitende</div>
    <button class="navbtn" data-view="neu" data-needs-hotel disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21c0-4 3.5-7 8-7s8 3 8 7M19 8v6M16 11h6"/></svg>Neuen Benutzer anmelden</button>
    <button class="navbtn" data-view="verwaltung" data-needs-hotel disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M1 21c0-4 3.5-7 8-7M15 15l6-6 2 2-6 6h-2z"/></svg>Benutzer bearbeiten / abmelden</button>
    <div class="navgroup">Postfächer</div>
    <button class="navbtn" data-view="generisch" data-needs-hotel disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Generisches Postfach</button>
    <div class="navgroup">Opera PMS</div>
    <button class="navbtn" data-view="operaNeu" data-needs-hotel disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 9v6M9 12h6"/></svg>Opera-Benutzer erstellen</button>
    <button class="navbtn" data-view="operaEdit" data-needs-hotel disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 15l1-3 6-6 2 2-6 6z"/></svg>Opera-Benutzer bearbeiten</button>
  </nav>
  <main><div class="wrap" id="view"><div class="loading">Anmeldung wird geprüft …</div></div></main>
</div>
<div id="modalRoot"></div>

<script src="vendor/msal-browser-3.28.1.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
